[build]
    command = "pnpm run build"
    publish = "build/"

[build.environment]
    NODE_VERSION = "24"

# Keep in step with PERMANENT_REDIRECTS in src/lib/redirects.ts; the unit
# test reads this file and fails if the two differ. `force` makes Netlify
# redirect even if a prerendered file exists at the old path.
[[redirects]]
    from = "/ediblegardens"
    to = "/projects/edible-gardens"
    status = 301
    force = true

[[redirects]]
    from = "/projects/ediblegardens"
    to = "/projects/edible-gardens"
    status = 301
    force = true

[[redirects]]
    from = "/contact"
    to = "/contact-us"
    status = 301
    force = true

# Baseline security headers for all responses. CSP is emitted per-response by
# SvelteKit (see `kit.csp` in svelte.config.js) so it is intentionally omitted
# here to avoid conflicting duplicates.
[[headers]]
    for = "/*"
    [headers.values]
        Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
        X-Content-Type-Options = "nosniff"
        X-Frame-Options = "SAMEORIGIN"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
    for = "/favicon.png"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/_app/immutable/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"
